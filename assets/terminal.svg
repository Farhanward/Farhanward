<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text-bold {
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 14px;
      fill: #202136;
      font-weight: bold;
    }

    .pixel-code {
      font-family: Courier, monospace;
      font-size: 16px;
      fill: #6CA8D1;
      font-weight: bold;
    }
    
    .window-bg { fill: #C19A6C; stroke: #10111A; stroke-width: 4; }
    .window-header { fill: #D8B589; stroke-bottom: #10111A; }
    .window-content { fill: #0A122E; stroke: #10111A; stroke-width: 4; }
    
    .btn-red { fill: #D95A40; stroke: #10111A; stroke-width: 2; }
    .btn-yellow { fill: #E8CC9D; stroke: #10111A; stroke-width: 2; }
    .btn-blue { fill: #3ac1e3; stroke: #10111A; stroke-width: 2; }
    
    /* Typewriter animation for lines */
    .line-1 { animation: type 1s steps(40, end) forwards; white-space: nowrap; overflow: hidden; }
    .line-2 { animation: type 1s steps(40, end) 1s forwards; opacity: 0; }
    .line-3 { animation: type 1s steps(40, end) 2s forwards; opacity: 0; }
    .line-4 { animation: type 1s steps(40, end) 3s forwards; opacity: 0; }
    .line-5 { animation: type 1s steps(40, end) 4s forwards; opacity: 0; }

    @keyframes type {
      0% { opacity: 1; stroke-dasharray: 0 1000; }
      100% { opacity: 1; stroke-dasharray: 1000 0; }
    }
  </style>

  <!-- Main Window -->
  <rect x="20" y="20" width="760" height="360" rx="10" class="window-bg" />
  
  <!-- Header Bar -->
  <path d="M 20 30 Q 20 20 30 20 L 770 20 Q 780 20 780 30 L 780 50 L 20 50 Z" class="window-header" />
  <line x1="20" y1="50" x2="780" y2="50" stroke="#10111A" stroke-width="4" />
  
  <!-- Header Title -->
  <text x="400" y="40" class="pixel-text-bold" text-anchor="middle">FILE MANAGER - profile.sys</text>
  
  <!-- Window Controls (Top Right) -->
  <g transform="translate(710, 35)">
    <circle cx="0" cy="0" r="8" class="btn-red" />
    <circle cx="25" cy="0" r="8" class="btn-yellow" />
    <circle cx="50" cy="0" r="8" class="btn-blue" />
  </g>

  <!-- Terminal Content Area -->
  <rect x="40" y="70" width="720" height="290" class="window-content" />

  <!-- Code / Info Text -->
  <g transform="translate(60, 100)" class="pixel-code">
    <text y="0">USER     : Farhan</text>
    <text y="30">ROLE     : OS Developer / Software Engineer</text>
    <text y="60">PROJECT  : HajimeOS - The Smart System</text>
    
    <text y="100" fill="#D95A40">------------- SKILLS MATRIX -------------</text>
    <text y="130">LANGS    : Rust, Python, JavaScript, C++</text>
    <text y="160">OS_DEV   : Kernel Architecture, Drivers, WM</text>
    <text y="190">TOOLS    : Git, QEMU, Docker, LLVM</text>
    
    <text y="230" fill="#D95A40">--------------- CONTACT ---------------</text>
    <text y="260">STATUS   : Building the future of operating systems.</text>
  </g>

  <!-- Hex codes on the right (like the screenshot) -->
  <g transform="translate(560, 100)" font-family="Courier, monospace" font-size="14" fill="#4A5568" font-weight="bold">
    <text y="0">00000010  B0 6B 80</text>
    <text y="20">00000020  53 E0 00</text>
    <text y="40">00000030  F2 FF F0</text>
    <text y="60">00000040  70 F0 F0</text>
    <text y="80">00000050  00 00 00</text>
    <text y="100">00000060  0F 00 00</text>
    <text y="120">00000070  60 00 00</text>
    <text y="140">00000080  00 00 00</text>
    <text y="160">00000090  80 00 00</text>
    <text y="180">000000A0  00 00 00</text>
    <text y="200">000000B0  70 80 00</text>
    <text y="220">000000C0  00 00 00</text>
    <text y="240">000000D0  00 00 00</text>
  </g>

</svg>
