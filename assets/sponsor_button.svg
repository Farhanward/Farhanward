<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 14px;
      fill: #202136;
      font-weight: bold;
      text-anchor: middle;
    }

    .arabic-text {
      font-family: Arial, sans-serif; /* Simplified for SVG compatibility, could use a pixel Arabic font if available */
      font-size: 18px;
      font-weight: bold;
      fill: #202136;
      text-anchor: middle;
    }
    
    /* Colors inspired by HajimeOS */
    .suit { fill: #E0E5EC; }
    .visor { fill: #00D2FF; }
    .visor-glow { fill: #FFFFFF; }
    .accent { fill: #D95A40; }
    .dark { fill: #2A2C46; }
    .outline { stroke: #1A1A2E; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    
    /* Button styles */
    .btn-base { fill: #C19A6C; stroke: #1A1A2E; stroke-width: 3; }
    .btn-highlight { fill: #E8CC9D; }
    .btn-shadow { fill: #8A6D4B; }
    
    /* Hover effect simulation using animation, though CSS hover works in some SVG contexts */
    .btn-group { cursor: pointer; }
    .btn-group:hover .btn-base { fill: #D8B589; }
    
    .pointing-arm {
      animation: pointPulse 1s infinite alternate;
      transform-origin: 50px 60px;
    }
    
    @keyframes pointPulse {
      0% { transform: translateX(0px); }
      100% { transform: translateX(5px); }
    }
  </style>

  <!-- Humanoid (Standing on the left, pointing right) -->
  <g transform="translate(10, 20)">
    <!-- Right Leg -->
    <rect x="28" y="65" width="10" height="20" rx="4" class="suit outline" />
    <!-- Left Leg -->
    <rect x="16" y="65" width="10" height="20" rx="4" class="suit outline" />

    <!-- Body -->
    <rect x="14" y="30" width="28" height="35" rx="8" class="suit outline" />
    <rect x="14" y="55" width="28" height="10" rx="3" class="accent outline" />

    <!-- Left Arm (Down) -->
    <path d="M 18 35 L 8 45 L 12 60" class="suit outline" />
    
    <!-- Head -->
    <rect x="10" y="0" width="36" height="32" rx="16" class="suit outline" />
    <rect x="18" y="8" width="28" height="16" rx="8" class="dark outline" />
    <rect x="20" y="10" width="24" height="12" rx="6" class="visor" />
    <path d="M 22 12 Q 32 12 40 18 L 22 18 Z" class="visor-glow" opacity="0.6" />
    <circle cx="10" cy="16" r="6" class="accent outline" />

    <!-- Right Arm (Pointing Right) - Animated -->
    <g class="pointing-arm">
      <path d="M 38 35 L 75 35" class="suit outline" stroke-width="8" />
      <path d="M 75 35 L 85 35" class="suit outline" stroke-width="4" />
      <circle cx="75" cy="35" r="5" class="suit outline" />
    </g>
  </g>

  <!-- The Button -->
  <g class="btn-group" transform="translate(120, 35)">
    <!-- Button Shadow -->
    <rect x="4" y="4" width="160" height="50" rx="5" class="btn-shadow outline" />
    <!-- Button Base -->
    <rect x="0" y="0" width="160" height="50" rx="5" class="btn-base" />
    <!-- Button Highlight (Top/Left edges) -->
    <path d="M 0 5 L 0 0 L 155 0 L 150 5 Z" class="btn-highlight" />
    <path d="M 0 50 L 0 0 L 5 5 L 5 45 Z" class="btn-highlight" />
    
    <!-- Text -->
    <text x="80" y="30" class="pixel-text">SPONSOR</text>
  </g>

</svg>
