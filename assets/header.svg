<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 14px;
      fill: #FFFFFF;
      text-shadow: 2px 2px 0px #000000;
    }
    
    .screen-bg { fill: #1A1C29; }
    .screen-glow { fill: url(#glow); }
    .frame-outer { fill: #2A2C46; stroke: #10111A; stroke-width: 4; }
    .frame-inner { fill: #8A6D4B; stroke: #10111A; stroke-width: 4; }
    .frame-highlight { fill: #C19A6C; }
    .frame-detail { fill: #4A5568; stroke: #10111A; stroke-width: 2; }
    
    .loading-bar-bg { fill: #10111A; stroke: #C19A6C; stroke-width: 3; }
    .loading-bar-fill { fill: #D95A40; animation: fillBar 4s cubic-bezier(0.1, 0.7, 1.0, 0.1) forwards; }
    
    @keyframes fillBar {
      0% { width: 0; }
      100% { width: 390px; } /* 400 - 10px padding */
    }

    .blinking-cursor {
      animation: blink 1s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D3156" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1A1C29" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Monitor Stand -->
  <rect x="350" y="270" width="100" height="30" class="frame-outer" />
  <rect x="300" y="290" width="200" height="10" class="frame-inner" />

  <!-- Outer Monitor Frame -->
  <rect x="50" y="20" width="700" height="250" rx="15" class="frame-outer" />
  <!-- Inner Monitor Frame (Tan) -->
  <rect x="70" y="40" width="660" height="210" rx="10" class="frame-inner" />
  <path d="M 70 50 Q 70 40 80 40 L 720 40 Q 730 40 730 50 L 730 60 L 70 60 Z" class="frame-highlight" />

  <!-- Monitor Screen -->
  <rect x="85" y="55" width="630" height="150" rx="20" class="screen-bg" stroke="#10111A" stroke-width="4" />
  <rect x="85" y="55" width="630" height="150" rx="20" class="screen-glow" />

  <!-- Dials & Buttons on Bottom Frame -->
  <!-- Left Power Button -->
  <rect x="90" y="215" width="60" height="25" rx="3" class="frame-detail" />
  <text x="120" y="232" font-family="'Press Start 2P'" font-size="8" fill="#10111A" text-anchor="middle">PWR</text>
  
  <!-- Right Dials -->
  <circle cx="680" cy="227" r="12" class="frame-detail" />
  <path d="M 680 227 L 685 218" stroke="#10111A" stroke-width="2" />
  <circle cx="640" cy="227" r="12" class="frame-detail" />
  <path d="M 640 227 L 632 220" stroke="#10111A" stroke-width="2" />

  <!-- Screen Content -->
  <!-- Text -->
  <text x="400" y="100" class="pixel-text" text-anchor="middle">HajimeOS: Initializing Profile<tspan class="blinking-cursor">_</tspan></text>
  
  <!-- Loading Bar -->
  <g transform="translate(200, 140)">
    <rect x="0" y="0" width="400" height="30" rx="4" class="loading-bar-bg" />
    <!-- Segmented Look using a pattern or multiple rects, but simple width animation is cleaner for SVG -->
    <rect x="5" y="5" width="0" height="20" rx="2" class="loading-bar-fill" />
    
    <!-- Grille lines for segmentation -->
    <g stroke="#10111A" stroke-width="3">
      <line x1="40" y1="5" x2="40" y2="25" />
      <line x1="80" y1="5" x2="80" y2="25" />
      <line x1="120" y1="5" x2="120" y2="25" />
      <line x1="160" y1="5" x2="160" y2="25" />
      <line x1="200" y1="5" x2="200" y2="25" />
      <line x1="240" y1="5" x2="240" y2="25" />
      <line x1="280" y1="5" x2="280" y2="25" />
      <line x1="320" y1="5" x2="320" y2="25" />
      <line x1="360" y1="5" x2="360" y2="25" />
    </g>
  </g>

</svg>
