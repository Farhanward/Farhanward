<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 10px;
      fill: #202136;
      font-weight: bold;
    }

    .pixel-title {
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 12px;
      fill: #202136;
      font-weight: bold;
    }
    
    .window-bg { fill: #D8B589; stroke: #10111A; stroke-width: 4; }
    .window-header { fill: #C19A6C; stroke-bottom: #10111A; }
    
    .input-box { fill: #FFFFFF; stroke: #10111A; stroke-width: 3; }
    
    .btn-base { fill: #8A6D4B; stroke: #10111A; stroke-width: 3; }
    .btn-text { fill: #FFFFFF; font-family: 'Press Start 2P', Courier, monospace; font-size: 10px; font-weight: bold; }
    
    .avatar-bg { fill: #202136; stroke: #10111A; stroke-width: 3; }
    .visor { fill: #3ac1e3; }
  </style>

  <!-- Login Window -->
  <rect x="20" y="20" width="360" height="260" rx="5" class="window-bg" />
  
  <!-- Header Bar -->
  <path d="M 20 25 Q 20 20 25 20 L 375 20 Q 380 20 380 25 L 380 45 L 20 45 Z" class="window-header" />
  <line x1="20" y1="45" x2="380" y2="45" stroke="#10111A" stroke-width="4" />
  
  <!-- Title -->
  <text x="200" y="37" class="pixel-title" text-anchor="middle">AUTHENTICATION</text>

  <!-- Avatar Circle (Like HajimeOS Login) -->
  <g transform="translate(200, 90)">
    <circle cx="0" cy="0" r="30" class="avatar-bg" />
    <!-- Mini Robot Head -->
    <rect x="-15" y="-12" width="30" height="24" rx="10" fill="#E0E5EC" stroke="#10111A" stroke-width="2" />
    <rect x="-10" y="-2" width="20" height="8" rx="4" class="visor" stroke="#10111A" stroke-width="2" />
  </g>

  <!-- Form Fields -->
  <g transform="translate(60, 140)">
    <text x="0" y="10" class="pixel-text">Support Type:</text>
    <rect x="130" y="-2" width="150" height="20" class="input-box" />
    <text x="140" y="12" class="pixel-text" fill="#4A5568">General Funding</text>
    
    <text x="0" y="45" class="pixel-text">Access Level:</text>
    <rect x="130" y="33" width="150" height="20" class="input-box" />
    <!-- Password dots -->
    <circle cx="145" cy="43" r="3" fill="#10111A" />
    <circle cx="155" cy="43" r="3" fill="#10111A" />
    <circle cx="165" cy="43" r="3" fill="#10111A" />
    <circle cx="175" cy="43" r="3" fill="#10111A" />
    <circle cx="185" cy="43" r="3" fill="#10111A" />
    <circle cx="195" cy="43" r="3" fill="#10111A" />
    <circle cx="205" cy="43" r="3" fill="#10111A" />
    <circle cx="215" cy="43" r="3" fill="#10111A" />
  </g>

  <!-- Login Button (Can be clicked if wrapped in markdown link) -->
  <g transform="translate(150, 210)" style="cursor: pointer;">
    <!-- Shadow -->
    <rect x="4" y="4" width="100" height="30" rx="3" fill="#4A5568" />
    <!-- Base -->
    <rect x="0" y="0" width="100" height="30" rx="3" class="btn-base" />
    <text x="50" y="20" class="btn-text" text-anchor="middle">LOGIN</text>
  </g>

</svg>
