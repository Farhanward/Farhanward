<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;display=swap');
    
    .pixel-text {
      font-family: 'Press Start 2P', Courier, monospace;
      font-size: 12px;
      fill: #202136;
      font-weight: bold;
    }
    
    .window-bg { fill: #8A6D4B; stroke: #10111A; stroke-width: 4; }
    .window-header { fill: #A3845C; stroke-bottom: #10111A; }
    
    .dial-bg { fill: #E0E5EC; stroke: #10111A; stroke-width: 3; }
    .dial-inner { fill: #F4F7F6; }
    .dial-hand { stroke: #D95A40; stroke-width: 3; stroke-linecap: round; }
    .dial-center { fill: #10111A; }
    
    .btn-red { fill: #D95A40; stroke: #10111A; stroke-width: 2; }
    
    /* Animations */
    .spin-slow { animation: spin 10s linear infinite; transform-origin: center; }
    .jitter { animation: jitter 2s ease-in-out infinite alternate; transform-origin: center; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes jitter {
      0% { transform: rotate(-20deg); }
      100% { transform: rotate(40deg); }
    }
  </style>

  <!-- Main Window -->
  <rect x="20" y="20" width="760" height="160" rx="5" class="window-bg" />
  
  <!-- Header Bar -->
  <path d="M 20 25 Q 20 20 25 20 L 775 20 Q 780 20 780 25 L 780 45 L 20 45 Z" class="window-header" />
  <line x1="20" y1="45" x2="780" y2="45" stroke="#10111A" stroke-width="4" />
  
  <text x="35" y="36" class="pixel-text">CONTROL PANEL - stats.exe</text>
  
  <!-- Close Button -->
  <rect x="745" y="25" width="15" height="15" class="btn-red" />
  <line x1="748" y1="28" x2="757" y2="37" stroke="#10111A" stroke-width="2" />
  <line x1="757" y1="28" x2="748" y2="37" stroke="#10111A" stroke-width="2" />

  <!-- Dials -->
  <!-- CPU Dial -->
  <g transform="translate(150, 110)">
    <circle cx="0" cy="0" r="40" class="dial-bg" />
    <circle cx="0" cy="0" r="30" class="dial-inner" />
    <!-- Ticks -->
    <g stroke="#10111A" stroke-width="2">
      <line x1="-25" y1="0" x2="-20" y2="0" />
      <line x1="20" y1="0" x2="25" y2="0" />
      <line x1="0" y1="-25" x2="0" y2="-20" />
    </g>
    <!-- Hand -->
    <line x1="0" y1="0" x2="15" y2="-15" class="dial-hand jitter" />
    <circle cx="0" cy="0" r="4" class="dial-center" />
    <text x="0" y="55" class="pixel-text" text-anchor="middle">PERFORMANCE</text>
  </g>

  <!-- Network Radar -->
  <g transform="translate(400, 110)">
    <circle cx="0" cy="0" r="40" class="dial-bg" />
    <circle cx="0" cy="0" r="30" class="dial-inner" fill="#0A122E" />
    <circle cx="0" cy="0" r="20" stroke="#6CA8D1" stroke-width="1" fill="none" />
    <circle cx="0" cy="0" r="10" stroke="#6CA8D1" stroke-width="1" fill="none" />
    
    <!-- Radar Sweep -->
    <path d="M 0 0 L 0 -30 A 30 30 0 0 1 21 -21 Z" fill="#6CA8D1" opacity="0.5" class="spin-slow" />
    <circle cx="0" cy="0" r="4" class="dial-center" fill="#6CA8D1" />
    <text x="0" y="55" class="pixel-text" text-anchor="middle">NETWORK</text>
  </g>

  <!-- System Load -->
  <g transform="translate(650, 110)">
    <rect x="-40" y="-30" width="80" height="60" rx="5" class="dial-bg" fill="#1A1C29" />
    <rect x="-30" y="-20" width="10" height="40" fill="#D95A40" />
    <rect x="-10" y="-10" width="10" height="30" fill="#E8CC9D" />
    <rect x="10" y="-15" width="10" height="35" fill="#3ac1e3" />
    <rect x="30" y="-25" width="10" height="45" fill="#6CA8D1" />
    <text x="0" y="55" class="pixel-text" text-anchor="middle">UPTIME</text>
  </g>

</svg>
